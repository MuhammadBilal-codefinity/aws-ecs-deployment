name: CI/CD with Cypress Pre-Deployment Check

on:
  push:
    branches:
      - aws-ecs-deployment

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      ECR_REPO_URI: 242201278398.dkr.ecr.us-east-1.amazonaws.com/projects/cognito-todo # Replace with your ECR repository URI
      IMAGE_TAG: latest
      ECS_CLUSTER_NAME: cluster # Replace with your ECS cluster name
      ECS_SERVICE_NAME: test-aqua # Replace with your ECS service name
      ECS_TASK_FAMILY: cluster-2-defination # Replace with your ECS task family name

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Start the Server
        run: |
          nohup npm run dev &

      - name: Wait for the Server to Be Ready
        run: |
          until curl -s http://localhost:5173; do
            echo "Waiting for server to start..."
            sleep 5
          done
          echo "Server is up!"

      - name: Run Cypress Tests (Fail on Test Failure)
        run: |
          npx cypress run

      - name: Post-Tests Cleanup (Optional)
        run: |
          pkill -f 'npm run dev'

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Tag Docker Image
        run: |
          docker build -t $ECR_REPO_URI:$IMAGE_TAG .

      - name: Push Docker Image to ECR
        run: |
          docker push $ECR_REPO_URI:$IMAGE_TAG

      - name: Register ECS Task Definition with New Image
        run: |
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --family $ECS_TASK_FAMILY \
            --cpu "256" \
            --memory "512" \
            --network-mode "awsvpc" \
            --requires-compatibilities "FARGATE" \
            --compatibilities "EC2" "FARGATE" \
            --requires-attributes "com.amazonaws.ecs.capability.logging-driver.awslogs" \
                                  "ecs.capability.execution-role-awslogs" \
                                  "com.amazonaws.ecs.capability.ecr-auth" \
                                  "com.amazonaws.ecs.capability.docker-remote-api.1.19" \
                                  "com.amazonaws.ecs.capability.docker-remote-api.1.28" \
                                  "ecs.capability.execution-role-ecr-pull" \
                                  "com.amazonaws.ecs.capability.docker-remote-api.1.18" \
                                  "ecs.capability.task-eni" \
                                  "com.amazonaws.ecs.capability.docker-remote-api.1.29" \
            --container-definitions "[{
              \"name\": \"cluster-defination-2\", 
              \"image\": \"$ECR_REPO_URI:$IMAGE_TAG\", 
              \"memory\": 512, 
              \"essential\": true,
              \"portMappings\": [{
                \"containerPort\": 5000,
                \"hostPort\": 5000,
                \"protocol\": \"tcp\"
              }]
            }]" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          # Extract the latest revision from the ARN (e.g., family-name:revision)
          LATEST_REVISION=$(echo $TASK_DEFINITION_ARN | awk -F':' '{print $2}')
          echo "LATEST_REVISION=$LATEST_REVISION" >> $GITHUB_ENV

      - name: Update ECS Service with New Task Definition
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER_NAME \
            --service $ECS_SERVICE_NAME \
            --task-definition $ECS_TASK_FAMILY:$LATEST_REVISION

      - name: Post-Deployment Success Notification
        run: echo "Docker image successfully pushed to ECR"
